version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    groups:
      routine-actions:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 100
    groups:
      routine-npm:
        update-types:
          - "minor"
          - "patch"
